[package]
name = "vlmcsd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Async and blocking KMS V4/V5/V6 server"

[features]
default = ["async", "blocking", "cli"]
std = ["dep:getrandom", "dep:thiserror", "dep:tracing"]
async = ["std", "dep:tokio", "tokio/macros"]
blocking = ["std"]
cli = ["async", "dep:clap", "dep:tracing-subscriber", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal"]

[[bin]]
name = "vlmcsd"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "async_server"
required-features = ["async"]

[dependencies]
getrandom = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
vlmcsd-protocol.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "net", "io-util", "sync", "time"] }
clap = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "process"] }

[[test]]
name = "blocking_server"
required-features = ["blocking"]

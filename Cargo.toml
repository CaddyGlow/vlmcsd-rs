[workspace]
members = ["crates/vlmcsd", "crates/vlmcs", "crates/vlmcsd-protocol"]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CaddyGlow/vlmcsd-rs"
rust-version = "1.96"

[workspace.dependencies]
vlmcsd-protocol = { version = "0.1.0", path = "crates/vlmcsd-protocol" }
aes = { version = "0.9.3", default-features = false, features = ["hazmat"] }
tokio = "1.53.2"
thiserror = { version = "2.0.21", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
getrandom = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
strip = true

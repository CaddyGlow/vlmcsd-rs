name: vlmcsd-rs CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --no-default-features --features blocking
      - run: cargo test --locked -p vlmcs --no-default-features --features blocking
      - run: cargo test --locked -p vlmcsd --no-default-features --features blocking
      - run: cargo test --locked --workspace --no-default-features --features async
      - run: cargo check --locked --workspace --no-default-features
      - name: Check packaged license notices match the originals
        shell: bash
        run: |
          for crate in vlmcs vlmcsd vlmcsd-protocol; do
            cmp LICENSE "crates/$crate/LICENSE"
            cmp THIRD-PARTY-NOTICES "crates/$crate/THIRD-PARTY-NOTICES"
          done
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --no-default-features --target thumbv7em-none-eabi
